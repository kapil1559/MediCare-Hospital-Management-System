<footer class="form-footer">

  <div class="form-footer__left">
    @if (saving()) {
      <span>Saving...</span>
    }
  </div>

  <div class="form-footer__actions">

    <button
      type="button"
      class="btn btn-secondary"
      (click)="cancel()">
      {{ cancelText() }}
    </button>

    <button
      type="button"
      class="btn btn-primary"
      [disabled]="disabled() || saving()"
      (click)="save()">

      {{ saving()
        ? 'Saving...'
        : saveText()
      }}

    </button>

  </div>

</footer>
